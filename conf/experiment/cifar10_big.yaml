# @package _global_
defaults:
  - override /data: cifar10
  - override /model: glow
  - override /prior: kpmvn

model:
  num_levels: 3
  steps_per_level: [32, 32, 32]
  hidden_channels: 512

prior:
  noise_features: [0, 0, 0]
  struct_features: [6, 12, 0]
  semantic_features: [0, 0, 48]
  rank: [[6, 8], [8, 8], [8, 8]]
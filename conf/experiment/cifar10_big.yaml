# @package _global_
defaults:
  - override /data: cifar10
  - override /model: glow
  - override /prior: kpmvn

model:
  num_levels: 3
  steps_per_level: [32, 32, 32]
  hidden_channels: 512
  dropout: 0.1

prior:
  noise_features:     [3, 0,  16]
  struct_features:    [3, 12, 0]
  semantic_features:  [0, 0,  32]
  rank: [[6, 8], [8, 8], [16, 8]]

wandb:
  group: "CIFAR10"
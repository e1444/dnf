dataset:
  name: "CIFAR10"
  path: "${paths.data}/cifar10"
  download: true
  train_transform:
    - type: "RandomAffine"
      params:
        degrees: 0
        translate: [0.1, 0.1]
    - type: "RandomHorizontalFlip"
    - type: "Dequantize"
  test_transform:
    - type: "Dequantize"
  batch_size: 128
  num_workers: 4
  shuffle: true
  train_split: 0.8
  valid_split: 0.2
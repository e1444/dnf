dataset:
  name: "CIFAR10"
  path: "${oc.env:SCRATCH}/dnf/data/cifar10"
  download: true
  train_transform:
    - type: "RandomHorizontalFlip"
    - type: "RandomCrop"
      params:
        size: 32
        padding: 4
        padding_mode: "reflect"
    - type: "Dequantize"
  test_transform:
    - type: "Dequantize"
  batch_size: 128
  num_workers: 4
  shuffle: true
  train_split: 0.8
  valid_split: 0.2
dataset:
  name: "MNIST"
  path: "${paths.data}/mnist"
  download: true
  num_classes: 10
  train_transform:
    - type: "Pad"
      params:
        padding: 2
    - type: "Dequantize"
  test_transform:
    - type: "Pad"
      params:
        padding: 2
    - type: "Dequantize"
  batch_size: 256
  num_workers: 4
  shuffle: true
  train_split: 0.8
  valid_split: 0.2
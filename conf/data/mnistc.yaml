dataset:
  name: "MNIST"
  path: "${paths.data}/mnist"
  download: true
  num_classes: 10
  train_transform:
    - type: "Pad"
      params:
        padding: 2
    - type: "RandomAffine"
      params:
        degrees: 1         # Rotates the image by up to +/- 1 degree
        translate: [0.01, 0.01] # Shifts the image by up to 1% horizontally and vertically
        scale: [0.99, 1.01]   # Zooms the image between 99% and 101%
    - type: "Dequantize"
    - type: "AddAWGN"
      params:
        snr_db: 9.5         # Adds Gaussian noise with a signal-to-noise ratio of 9.5 dB
  test_transform:
    - type: "Pad"
      params:
        padding: 2
    - type: "Dequantize"
    - type: "AddAWGN"
      params:
        snr_db: 9.5         # Adds Gaussian noise with a signal-to-noise ratio of 9.5 dB
  batch_size: 256
  num_workers: 4
  shuffle: true
  train_split: 0.8
  valid_split: 0.2
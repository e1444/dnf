defaults:
  - default
  - _self_
  - override /scheduler@scheduler: cosine

epochs: 10
lr: 1e-3
lr_prior: [0, 0, 0]
lr_prior_channel: [0, 0, 0]
lr_prior_spatial: [0, 0, 0]

# High Regularization
r_logdet: 0
r_aniso: 5e0
label_smoothing: 0.1

# Loss Weights
l_lambda: 0.7     # NLL weight (1.0 - lambda = CE weight)
em_steps: 0

# Disable EMA for warmup (phase 1)
use_ema: false

# Dimension-aware NLL reweighting (combat NLL dominance at early levels)
nll_dim_reweight: true
nll_dim_strategy: "sqrt"  # Use sqrt normalization to partially balance dimensions
nll_level_weights: [0.25, 0.33, 1.0]  # Reduce NLL at early levels to achieve 1:1 CE:NLL ratio
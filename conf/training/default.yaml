defaults:
  - _self_
  - /scheduler@scheduler: cosine

lr: 1e-3
lr_prior: [0, 0, 0]

gradclip: 1.0
weight_decay: 1e-4
epochs: 20

eval_interval: 1
checkpoint_interval: 5

# Loss and regularization weights
r_logdet: 1e-4
r_aniso: 1e-3
label_smoothing: 0.1

# Scheduler settings
warmup_epochs: 5

# Lagrange multipliers settings
use_al: false
log_alpha: 0.0
lr_log_alpha: 1e-3
aug_rho: 1.0
nll_constraint: -3000.0

ckpt: null
load_model: false
load_prior: false
reset_optimizer: false
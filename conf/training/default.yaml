lr: 1e-3
lr_means: 0
lr_vars: 0
gradclip: 1.0
gradclip_means: 1.0
gradclip_vars: 1.0
weight_decay: 1e-4
epochs: 50
eval_interval: 1
checkpoint_interval: 5

# Loss and regularization weights
lambda_: 0.8
gamma_alpha: 0.5
gamma_beta: 1.0
beta_final: 2.0
aux_freq: 1
aux_total: 8
r_logdet: 1e-2
label_smoothing: 0.1

# Scheduler settings
scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  step_size: 25
  gamma: 0.5

# Initialization
latent_separation: 1.0
latent_v: 0
latent_noise: 0.1
features: 1024
num_classes: 10

resume_from_checkpoint: null
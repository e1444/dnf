lr: 1e-3
lr_mu: 0
lr_L:: 0

gradclip: 1.0
gradclip_mu: 1.0
gradclip_L: 1.0

weight_decay: 1e-4
epochs: 20
warmup_epochs: 5

eval_interval: 1
checkpoint_interval: 5

# Loss and regularization weights
r_logdet: 1e-2
label_smoothing: 0.1

# Scheduler settings
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  T_0: 10
  T_mult: 2
  eta_min: 1e-6

# Initialization
semantic_counts: [2, 6, 48]
latent_separation: 1.0
latent_L_scale: 1.0
features: 256
num_classes: 10

# Lagrange multipliers settings
use_al: false
log_alpha: 0.0
lr_log_alpha: 1e-3
aug_rho: 1.0
nll_constraint: -3000.0

resume_from_checkpoint: null
reset_optimizer: false
reset_freeze: true
freeze_steps:
  start: null
  end: null
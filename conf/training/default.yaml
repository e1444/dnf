lr: 1e-3
lr_prior: 0

gradclip: 1.0
weight_decay: 1e-4
epochs: 20

eval_interval: 1
checkpoint_interval: 5

# Loss and regularization weights
gamma_beta: 0.5
aux_start: 32
aux_freq: 1
aux_end: 40
r_logdet: 1e-2
label_smoothing: 0.1

# Scheduler settings
warmup_epochs: 5
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${..epochs}
  eta_min: 1e-5

# Lagrange multipliers settings
use_al: false
log_alpha: 0.0
lr_log_alpha: 1e-3
aug_rho: 1.0
nll_constraint: -3000.0

resume_from_checkpoint: null
reset_optimizer: false
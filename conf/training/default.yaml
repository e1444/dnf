lr: 1e-3
lr_prior: 0.0

gradclip: 1.0
gradclip_prior: 1.0

weight_decay: 1e-4
epochs: 30
warmup_epochs: 5

eval_interval: 1
checkpoint_interval: 5

# Loss and regularization weights
r_logdet: 1e-5
label_smoothing: 0.1

# Optimizer settings
optimizer: "Adamax" # Options: "AdamW", "Adamax"

# Scheduler settings
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  T_0: 10
  T_mult: 2
  eta_min: 1e-6

# Prior structure settings
noise_counts: [2, 4, 16]
struct_counts: [0, 0, 0]
semantic_counts: [0, 0, 0]
simplex_scale: 1.0
num_classes: 10

# Lagrange multipliers settings
use_al: false
log_alpha: 0.0
lr_log_alpha: 1e-3
aug_rho: 1.0
nll_constraint: 0.0

resume_from_checkpoint: null
reset_optimizer: false
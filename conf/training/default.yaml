defaults:
  - _self_
  - /scheduler@scheduler: cosine

lr: 1e-3
lr_prior: [0, 0, 0]
lr_prior_channel: [0, 0, 0]
lr_prior_spatial: [0, 0, 0]

gradclip: 1.0
weight_decay: 1e-4
epochs: 20

eval_interval: 1
checkpoint_interval: 5

# Loss and regularization weights
r_logdet: 1e-4
r_aniso: 1e-3
label_smoothing: 0.1

# Scheduler settings
warmup_epochs: 5

# Loss Weights
l_lambda: 0.5     # NLL weight (1.0 - lambda = CE weight)
em_steps: 2

# Dimension-aware NLL reweighting (helps early levels get CE signal)
nll_dim_reweight: false  # Enable dimension normalization
nll_dim_strategy: "sqrt"  # "none", "full" (1/dim), "sqrt" (1/sqrt(dim)), "inverse" (dim_top/dim)
nll_level_weights: null  # Per-level NLL multipliers [w0, w1, w2] or null for [1.0, 1.0, 1.0]

ckpt: null
load_model: false
load_prior: false
reset_optimizer: false
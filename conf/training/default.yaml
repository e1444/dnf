lr: 1e-3
lr_mu: 0
lr_v: 0
lr_U: 0

gradclip: 1.0
gradclip_mu: 1.0
gradclip_v: 1.0
gradclip_U: 1.0

weight_decay: 1e-4
epochs: 20

eval_interval: 1
checkpoint_interval: 5

# Loss and regularization weights
lambda_: 0.8
gamma_beta: 1.0
aux_freq: 1
aux_total: 8
r_logdet: 1e-2
label_smoothing: 0.1

# Scheduler settings
scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  step_size: 10
  gamma: 0.5

# Initialization
latent_separation: 1.0
latent_v: 0
latent_v_eps: 1e-4
latent_U_size: 20
latent_df: 10
latent_noise: 0.1
features: 1024
num_classes: 10

# Lagrange multipliers settings
log_alpha_lr: 1e-3
aug_rho: 1.0
nll_constraint: -3000.0

resume_from_checkpoint: null
reset_freeze: true
freeze_steps:
  start: null
  end: null
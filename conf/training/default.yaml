lr: 1e-3
lr_mu: 0
lr_v: 0
lr_U: 0
lr_df: 0

gradclip: 1.0
gradclip_mu: 1.0
gradclip_v: 1.0
gradclip_U: 1.0
gradclip_df: 1.0

weight_decay: 1e-4
epochs: 20
warmup_epochs: 5

eval_interval: 1
checkpoint_interval: 5

# Loss and regularization weights
lambda_: 0.8
gamma_beta: 0.5
aux_start: 32
aux_freq: 1
aux_end: 40
r_logdet: 1e-2
label_smoothing: 0.1

# Scheduler settings
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  # T_0: Number of epochs for the first restart. 
  # Set this to ~10-20% of your total epochs (e.g., 10 if total is 100).
  T_0: 10
  # T_mult: Factor to increase the cycle length after each restart.
  # 2 means cycles go: 10 epochs, 20 epochs, 40 epochs...
  # This allows fine-tuning in later stages.
  T_mult: 2
  # eta_min: Minimum learning rate at the bottom of the cosine curve.
  # Usually 1e-6 or 0.
  eta_min: 1e-6

# Initialization
latent_separation: 1
latent_v: -5
latent_v_eps: 1e-4
latent_U_size: 20
latent_df: 20
latent_noise: 0.0
features: 256
num_classes: 10

# Lagrange multipliers settings
use_al: false
log_alpha: 0.0
lr_log_alpha: 1e-3
aug_rho: 1.0
nll_constraint: -3000.0

resume_from_checkpoint: null
reset_optimizer: false
reset_freeze: true
freeze_steps:
  start: null
  end: null
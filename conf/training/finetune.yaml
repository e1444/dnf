defaults:
  - default
  - _self_
  - override /scheduler@scheduler: cosine_wr

epochs: 70
lr: 1e-4
lr_prior: [1e-5, 1e-4, 1e-3]

r_logdet: 0.0
label_smoothing: 0.0

use_al: True
log_alpha: 1.0
lr_log_alpha: 1e-3
nll_constraint: 0.0   # Specify based on warmup results
aug_rho: 1.0

reset_optimizer: true
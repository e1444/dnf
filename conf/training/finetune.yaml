defaults:
  - default
  - _self_
  - override /scheduler@scheduler: cosine_wr

epochs: 70
lr: 1e-4
lr_prior: [1e-5, 1e-4, 1e-3]
lr_prior_channel: [1e-5, 1e-4, 1e-3]
lr_prior_spatial: [1e-5, 1e-4, 1e-3]

r_logdet: 0.0
r_aniso: 0.0
label_smoothing: 0.0

# Disable dimension reweighting for clean MLE
nll_dim_reweight: false

# Use EMA for stable evaluation in finetuning
use_ema: true

use_al: True
log_alpha: 1.0
lr_log_alpha: 1e-3
nll_constraint: 0.0   # Specify based on warmup results
aug_rho: 1.0

ckpt: null
load_model: true
load_prior: true
reset_optimizer: true
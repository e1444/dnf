defaults:
  - /prior@priors.l0: kpmvt  # (6, 16, 16)
  - /prior@priors.l1: kpmvt  # (12, 8, 8)
  - /prior@priors.l2: kpmvt  # (48, 4, 4)

priors:
  l0:
    split: [0, 6, 0]
    rank: [4, 8]
    struct:
      type: conditional
      use_mean_shift: true
      num_modes: 4
      init_strategy: simplex
      simplex_scale: 0.5
      df: 6.0
      tau: -0.405  # log((df-2)/df) to match ActNorm variance=1
      backbone_features: 128
      dropout: 0.1
      eps: 1e-4
      jitter: 1e-4
  l1:
    split: [0, 6, 6]
    rank: [8, 8]
    struct:
      type: conditional
      use_mean_shift: true
      num_modes: 3
      init_strategy: simplex
      simplex_scale: 0.5
      df: 12.0
      tau: -0.182  # log((df-2)/df) to match ActNorm variance=1
      backbone_features: 256
      dropout: 0.0
      eps: 1e-4
      jitter: 1e-4
    sem:
      type: conditional_mean_shift
      num_modes: 3
      init_strategy: simplex
      simplex_scale: 0.5
      df: 12.0
      tau: -0.182  # log((df-2)/df) to match ActNorm variance=1
      backbone_features: 256
      dropout: 0.0
      eps: 1e-4
      jitter: 1e-4
  l2:
    split: [24, 0, 24]
    rank: [8, 8]
    noise:
      df: 24.0
      eps: 1e-4
      jitter: 1e-4
    sem:
      df: 48.0
      simplex_scale: 0.7        # Controls separation of sem mixture components
      eps: 1e-4
      jitter: 1e-4
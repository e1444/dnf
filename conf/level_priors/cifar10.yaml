defaults:
  - /prior@priors.l0: kpmvn  # (6, 16, 16)
  - /prior@priors.l1: kpmvn  # (12, 8, 8)
  - /prior@priors.l2: kpmvn  # (48, 4, 4)

priors:
  l0:
    split: [0, 6, 0]
    rank: [4, 8]
    conditional_cls:
      _target_: src.models.priors.ConditionalMixturePrior
      tau: 1536.0   # 1536 / 1
      dropout: 0.1
      backbone_features: 128
      num_components: 2
    class_conditional_init:
      simplex_scale: 0.1
  l1:
    split: [0, 12, 0]
    rank: [8, 8]
    conditional_cls:
      _target_: src.models.priors.ConditionalMixturePrior
      tau: 768.0    # 768 / 1
      dropout: 0.0
      backbone_features: 256
      num_components: 8
    class_conditional_init:
      simplex_scale: 0.2
  l2:
    split: [32, 0, 16]
    rank: [8, 8]
    cls:
      tau: 512.0              # Controls entropy of noise prior (512 / 1)
    class_conditional_init:
      simplex_scale: 0.6      # Controls separation of sem mixture components
      tau_marginal: 256.0      # Controls marginal entropy of sem mixture (256 / 1)
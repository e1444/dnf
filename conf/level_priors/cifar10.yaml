defaults:
  - /prior@priors.l0: kpmvn  # (6, 16, 16)
  - /prior@priors.l1: kpmvn  # (12, 8, 8)
  - /prior@priors.l2: kpmvn  # (48, 4, 4)

priors:
  l0:
    split: [0, 6, 0]
    rank: [4, 16]
    conditional_cls:
      dropout: 0.1
      backbone_features: 128
  l1:
    split: [0, 12, 0]
    rank: [8, 8]
  l2:
    split: [16, 0, 32]
    rank: [16, 8]
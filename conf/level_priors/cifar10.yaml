defaults:
  - /prior@priors.l0: kpmvn  # (6, 16, 16)
  - /prior@priors.l1: kpmvn  # (12, 8, 8)
  - /prior@priors.l2: kpmvn  # (48, 4, 4)

priors:
  l0:
    split: [0, 6, 0]
    rank: [4, 8]
    conditional_cls:
      dropout: 0.1
      backbone_features: 128
      tau: 25.0
  l1:
    split: [0, 12, 0]
    rank: [8, 8]
    conditional_cls:
      tau: 5.0
  l2:
    split: [32, 0, 16]
    rank: [8, 8]
    cls:
      tau: 5.0              # Controls entropy of noise prior
    class_conditional_init:
      simplex_scale: 0.6    # Controls separation of sem mixture components
      tau_marginal: 1.0     # Controls marginal entropy of sem mixture
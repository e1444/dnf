defaults:
  - /prior@priors.l0: kpmvt  # (6, 16, 16)
  - /prior@priors.l1: kpmvt  # (12, 8, 8)
  - /prior@priors.l2: kpmvt  # (48, 4, 4)

priors:
  l0:
    split: [0, 6, 0]
    rank: [4, 8]
    struct:
      df: 6.0
      dropout: 0.1
      backbone_features: 128
      eps: 1e-4
      jitter: 1e-4
  l1:
    split: [0, 12, 0]
    rank: [8, 8]
    struct:
      df: 12.0
      dropout: 0.0
      backbone_features: 256
      eps: 1e-4
      jitter: 1e-4
  l2:
    split: [24, 0, 24]
    rank: [8, 8]
    noise:
      df: 24.0
      eps: 1e-4
      jitter: 1e-4
    sem:
      df: 48.0
      simplex_scale: 0.7        # Controls separation of sem mixture components
      eps: 1e-4
      jitter: 1e-4
defaults:
  - /prior@priors.l0: kpmvn  # (6, 16, 16)
  - /prior@priors.l1: kpmvn  # (12, 8, 8)
  - /prior@priors.l2: kpmvn  # (48, 4, 4)

priors:
  l0:
    split: [0, 6, 0]
    rank: [2, 8]
    conditional_cls:
      blur_sigma: 1.0
      dropout: 0.1
      backbone_features: 128
  l1:
    split: [0, 12, 0]
    rank: [4, 4]
  l2:
    split: [0, 0, 48]
    rank: [16, 8]
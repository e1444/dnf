defaults:
  - /prior@priors.l0: kpmvt  # (6, 16, 16)
  - /prior@priors.l1: kpmvt  # (12, 8, 8)
  - /prior@priors.l2: kpmvn  # (48, 4, 4)

priors:
  l0:
    split: [0, 6, 0]
    rank: [4, 8]
    conditional_cls:
      _target_: src.models.priors.ConditionalKPMVTPrior
      tau: 1536.0   # 1536 / 1
      df: 8.0
      dropout: 0.1
      backbone_features: 128
      eps: 1e-2
      jitter: 1e-4
  l1:
    split: [0, 12, 0]
    rank: [8, 8]
    conditional_cls:
      _target_: src.models.priors.ConditionalKPMVTPrior
      tau: 576.0    # 768 * 0.75
      df: 12.0
      dropout: 0.0
      backbone_features: 256
      eps: 1e-2
      jitter: 1e-4
  l2:
    split: [32, 0, 16]
    rank: [8, 8]
    cls:
      eps: 1e-2
      jitter: 1e-4
      tau: 256.0                # Controls entropy of noise prior (512 * 0.5)
    class_conditional_init:
      simplex_scale: 0.7        # Controls separation of sem mixture components
      tau_marginal: 32.0       # Controls marginal entropy of sem mixture (256 * 0.125)
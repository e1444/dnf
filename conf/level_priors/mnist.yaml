defaults:
  - /prior@priors.l0: kpmvn # (2, 16, 16)
  - /prior@priors.l1: kpmvn # (4, 8, 8)
  - /prior@priors.l2: kpmvn # (16, 4, 4)

priors:
  l0:
    split: [0, 2, 0]        # noise, struct, sem
    rank: [2, 8]
    conditional_cls:
      dropout: 0.1
      backbone_features: 128
      tau: 4.0
  l1:
    split: [0, 4, 0]
    rank: [4, 8]
    conditional_cls:
      tau: 2.0
  l2:
    split: [0, 0, 16]
    rank: [8, 8]
    cls:
      tau: 2.0              # Controls entropy of noise prior
    class_conditional_init:
      simplex_scale: 0.6    # Controls separation of sem mixture components
      tau_marginal: 1.0     # Controls marginal entropy of sem mixture
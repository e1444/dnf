# Configuration file for Hydra
defaults:
  - _self_
  - data: mnist
  - model: glow
  - training: default

project:
  name: Discriminative Normalizing Flow
  description: Training a DNF model.

paths:
  data: ./data
  model: ./models
  logs: ./logs
  checkpoints: ./checkpoints

hydra:
  run:
    dir: ${paths.logs}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${paths.logs}/sweeps/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

wandb:
  project: DNF
  entity: e1444-university-of-toronto
  name: "dnf-run-${now:%Y-%m-%d-%H-%M-%S}"
  group: "MNIST"

logging:
  level: INFO
  format: "[%(asctime)s] %(levelname)s: %(message)s"